<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hall das Fluidas</title>
<style>
  :root {
    --azul:     #1AABB0;
    --azul-esc: #0D6E72;
    --azul-cl:  #F0FAFA;
    --branco:   #FFFFFF;
    --cinza:    #64748B;
    --borda:    #A8DCDF;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--azul-cl);
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, var(--azul-esc) 0%, var(--azul) 100%);
    padding: 2.5rem 1rem 2rem;
    text-align: center;
    color: var(--branco);
  }
  header img.logo {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,.2);
  }
  header h1 {
    font-size: clamp(1.4rem, 5vw, 2rem);
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  header p {
    margin-top: .75rem;
    font-size: .95rem;
    opacity: .85;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1rem 3rem;
  }

  #loading {
    text-align: center;
    padding: 3rem;
    color: var(--cinza);
    font-size: 1rem;
  }
  #erro {
    display: none;
    text-align: center;
    padding: 2rem;
    color: #DC2626;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1.25rem;
  }

  .card {
    background: var(--branco);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(26,171,176,.08);
    border: 1px solid var(--borda);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1.75rem 1.25rem 1.5rem;
    gap: .6rem;
    transition: transform .2s, box-shadow .2s;
  }
  .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(26,171,176,.18); }

  .foto-wrap {
    width: 88px; height: 88px;
    border-radius: 50%;
    overflow: hidden;
    border: 3px solid var(--azul);
    flex-shrink: 0;
    background: var(--azul-cl);
    display: flex; align-items: center; justify-content: center;
  }
  .foto-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .foto-wrap .inicial {
    font-size: 2rem; font-weight: 700;
    color: var(--azul);
  }

  .nome {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--azul-esc);
    text-align: center;
  }

  .nicho {
    font-size: .82rem;
    color: var(--cinza);
    text-align: center;
    line-height: 1.4;
  }

  .ig-btn {
    margin-top: .25rem;
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    background: var(--azul-cl);
    color: var(--azul);
    font-size: .8rem;
    font-weight: 600;
    padding: .35rem .85rem;
    border-radius: 99px;
    text-decoration: none;
    border: 1px solid var(--borda);
    transition: background .2s;
  }
  .ig-btn:hover { background: var(--borda); }
  .ig-btn svg { flex-shrink: 0; }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: .78rem;
    color: var(--cinza);
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: repeat(2, 1fr); gap: .9rem; }
    .card { padding: 1.25rem .9rem 1.1rem; }
    .foto-wrap { width: 72px; height: 72px; }
    .nome { font-size: .95rem; }
  }
</style>
</head>
<body>

<header>
  <img class="logo" src="https://imgur.com/a/MB4AWTs"/>
  <h1>Hall das Fluidas</h1>
  <p>A elite da Gestão Feminista está aqui 🌊<br>Conheça as mulheres que dividem essa jornada com você, manda um oi, chama para um café, contrate e seja contratada.</p>
</header>

<main>
  <div id="loading">Carregando fluidas... ✨</div>
  <div id="erro">Não foi possível carregar os dados. Tente novamente.</div>
  <div class="grid" id="grid"></div>
</main>

<footer>Rede Fluida © 2026</footer>

<script>
  const IG_ICON = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>`;

  async function carregar() {
    try {
      
export default async function handler(req, res) {
  res.setHeader("Access-Control-Allow-Origin", "*");

  const token = process.env.NOTION_TOKEN;
  const dbId  = process.env.NOTION_DB_ID;

  try {
    const r = await fetch(`https://api.notion.com/v1/databases/${dbId}/query`, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Notion-Version": "2022-06-28",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        filter: {
          property: "Status",
          select: { equals: "Ativa" },
        },
        sorts: [{ property: "Mentoradas", direction: "ascending" }],
      }),
    });

    const data = await r.json();

    const fluidas = data.results.map(p => {
      const props = p.properties;

      const nome = props["Mentoradas"]?.title?.[0]?.plain_text ?? "";

      const instagramRaw = props["INSTAGRAM"]?.url ?? "";
      const instagram = instagramRaw.replace(/\/$/, "");
      const handle = instagram.replace("https://www.instagram.com/", "@").replace("https://instagram.com/", "@");

      const nicho = props["Nicho"]?.rich_text?.[0]?.plain_text ?? "";

      const foto = p.icon?.type === "file"
        ? p.icon.file.url
        : p.icon?.type === "external"
        ? p.icon.external.url
        : null;

      return { nome, instagram, handle, nicho, foto };
    }).filter(f => f.nome);

    res.status(200).json(fluidas);
  } catch (e) {
    res.status(500).json({ error: e.message });
  }
}

  carregar();
</script>
</body>
</html>
